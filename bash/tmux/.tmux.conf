# ~/.tmux.conf  --  modernized for tmux >= 3.0 (tested on 3.4)
#
# NOTE ON THE 2.9 BREAKING CHANGE:
# tmux 2.9 removed all of the separate `foo-fg` / `foo-bg` / `foo-attr` options
# and replaced each trio with a single `foo-style` option, e.g.
#     set -g status-fg colour137     -->  set -g status-style 'fg=colour137,bg=colour234,dim'
#     set -g status-bg colour234
#     set -g status-attr dim
# The old names now produce "invalid option: ..." errors. Everything below uses
# the new `-style` form.

##############################################################################
### CORE BEHAVIOUR
##############################################################################

# Change prefix chord to Ctrl-o
set -g prefix C-o
unbind-key C-b
# Make 'C-o C-o' type a literal C-o
bind-key C-o send-prefix

# Reload this file:  prefix r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# True colour. tmux's own $TERM should be tmux-256color (screen-256color is a
# legacy stand-in that lacks italics and a few other caps); then advertise RGB
# for the *outer* terminal so 24-bit colour passes through.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -as terminal-features ',alacritty:RGB'
set -as terminal-features ',*-256color:RGB'

# Don't swallow the Escape key waiting for a possible escape sequence. The old
# 500ms default makes Escape feel broken in vim/emacs/readline.
set -s escape-time 10

# Let programs inside tmux know when the terminal gains/loses focus.
set -g focus-events on

# Big scrollback. Agent output (Claude Code teams, build logs) eats this fast.
set -g history-limit 100000

# Windows and panes count from 1, matching the number keys' physical order,
# and renumber so you never end up with gaps like 1,2,5.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Resize to the smallest *attached* client rather than the smallest client that
# ever looked at the window. Matters when several clients share a session.
setw -g aggressive-resize on

# Set terminal emulator's title to current tab's title
set -g set-titles on

# Mouse: click to select pane/window, drag borders to resize, wheel to scroll.
# This replaces the old `smcup@:rmcup@` terminal-override hack for scrolling,
# which is obsolete and breaks full-screen apps -- it is intentionally gone.
set -g mouse on

# Longer display for messages / pane indicators
set -g display-time 2000
set -g display-panes-time 2000

##############################################################################
### KEY BINDINGS
##############################################################################

# Change split command bindings to be a little more representative,
# and inherit the current directory.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
unbind-key '"'
unbind-key %

# New windows open in the current directory too
bind-key c new-window -c "#{pane_current_path}"

# Change previous and next to be horizontal movement aligned with emacs commands.
unbind-key f # Was find-window.
unbind-key n
unbind-key p

bind-key C-f command-prompt "find-window -- '%%'"
bind-key f next-window
bind-key b previous-window

# Deliberately NOT rebinding the plain arrow keys: since 3.x tmux already ships
#   prefix + Arrow    -> select-pane      (move between panes)
#   prefix + M-Arrow  -> resize-pane by 5
#   prefix + C-Arrow  -> resize-pane by 1
# all of them repeatable, so overriding Arrow with resize-pane would only cost
# you pane navigation.

##############################################################################
### BELLS AND NOTIFICATIONS  (all quiet)
##############################################################################

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

##############################################################################
### APPEARANCE
##############################################################################
# The original file had two competing colour schemes; only the second one ever
# took effect (later `set` wins). Consolidated to that one here.

# Panes
set -g pane-border-style        'fg=colour238,bg=colour235'
set -g pane-active-border-style 'fg=colour51,bg=colour236'

# Status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 2
set -g status-style 'fg=colour137,bg=colour234,dim'
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50

# Window list
setw -g window-status-style          'fg=colour138,bg=colour235,none'
setw -g window-status-format         ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
setw -g window-status-current-style  'fg=colour81,bg=colour238,bold'
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-bell-style     'fg=colour255,bg=colour1,bold'

# Copy mode / clock
setw -g mode-style 'fg=colour196,bg=colour238,bold'
setw -g clock-mode-colour colour135

# Messages and the command prompt
set -g message-style         'fg=colour232,bg=colour166,bold'
set -g message-command-style 'fg=blue,bg=black'
